<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<meta name="color-scheme" content="dark">
<title>بصمة للكمبيوتر والهواتف | صيانة أجهزة في النجف</title>
<meta name="description" content="بصمة لصيانة الكمبيوتر والهواتف في النجف. صيانة لابتوبات، تبديل شاشات وبطاريات، تركيب SSD ورام، تنظيف وتسريع الأجهزة واسترجاع الملفات.">
<meta name="keywords" content="صيانة كمبيوتر النجف, صيانة لابتوب النجف, صيانة هواتف النجف, تبديل شاشة, SSD, رام, استرجاع ملفات">
<meta property="og:title" content="بصمة للكمبيوتر والهواتف | صيانة في النجف">
<meta property="og:description" content="فني صيانة كمبيوتر وهواتف يصل إلى موقعك في النجف.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ROOT
========================================================= */
:root{
  --bg:#080d12;
  --bg-2:#0c131b;
  --surface:#111923;
  --surface-2:#17212c;
  --gold:#e6a23c;
  --gold-light:#f6d28e;
  --gold-dark:#b87524;
  --teal:#36b8a7;
  --teal-light:#65d5c5;
  --text:#f2f0ea;
  --muted:#8d98a5;
  --muted-2:#66727f;
  --border:rgba(255,255,255,.09);
  --border-gold:rgba(230,162,60,.35);
  --radius:18px;
  --shadow:0 25px 80px rgba(0,0,0,.38);
  --container:1180px;
}

/* =========================================================
   RESET
========================================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;scroll-padding-top:90px;}
body{
  background:
    radial-gradient(circle at 10% -10%, rgba(230,162,60,.13), transparent 30%),
    radial-gradient(circle at 100% 15%, rgba(54,184,167,.09), transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:'Noto Kufi Arabic',sans-serif;
  line-height:1.75;
  overflow-x:hidden;
}
body.menu-open{overflow:hidden;}
::selection{background:var(--gold);color:#111;}
img{display:block;width:100%;max-width:100%;}
a{color:inherit;text-decoration:none;}
button,input,textarea,select{font:inherit;}
button{cursor:pointer;}
.container{width:min(var(--container), calc(100% - 40px));margin-inline:auto;}
.section{padding:110px 0;}

/* =========================================================
   SCROLL PROGRESS BAR (جديد)
========================================================= */
.scroll-progress{
  position:fixed;
  top:0;
  right:0;
  height:3px;
  width:0%;
  background:linear-gradient(90deg,var(--gold-light),var(--gold),var(--teal));
  z-index:10000;
  transition:width .1s linear;
  box-shadow:0 0 15px rgba(230,162,60,.6);
}

/* =========================================================
   LOADING SCREEN
========================================================= */
.loader{
  position:fixed;inset:0;z-index:9999;
  background:#070b10;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .6s ease, visibility .6s ease;
}
.loader.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.loader-inner{text-align:center;}
.loader-logo{
  width:70px;height:70px;margin:0 auto 20px;
  border-radius:50%;
  border:1px solid rgba(230,162,60,.5);
  display:grid;place-items:center;
  color:var(--gold);
  box-shadow:0 0 0 8px rgba(230,162,60,.05), 0 0 45px rgba(230,162,60,.16);
  animation:pulse 1.8s infinite;
}
.loader-logo svg{width:34px;height:34px;}
.loader-title{font-size:28px;color:var(--text);letter-spacing:1px;}
.loader-line{
  width:150px;height:2px;
  background:rgba(255,255,255,.08);
  margin:14px auto 0;overflow:hidden;
}
.loader-line::after{
  content:"";display:block;
  width:45%;height:100%;
  background:var(--gold);
  animation:loading 1.2s infinite ease-in-out;
}
@keyframes loading{
  0%{transform:translateX(250%);}
  100%{transform:translateX(-250%);}
}
@keyframes pulse{
  50%{transform:scale(1.05);box-shadow:0 0 0 12px rgba(230,162,60,.03), 0 0 55px rgba(230,162,60,.22);}
}

/* =========================================================
   HEADER
========================================================= */
header{
  position:sticky;top:0;z-index:1000;
  background:rgba(8,13,18,.84);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  transition:background .3s ease, box-shadow .3s ease;
}
header.scrolled{
  background:rgba(8,13,18,.95);
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}
.nav{
  min-height:78px;
  display:flex;align-items:center;justify-content:space-between;
  gap:30px;
}
.logo{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.logo-mark{
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(var(--bg),var(--bg)) padding-box,
             linear-gradient(135deg,var(--gold-light),var(--gold-dark)) border-box;
  border:1.5px solid transparent;
  box-shadow:0 0 0 4px rgba(230,162,60,.05), 0 8px 30px rgba(230,162,60,.12);
  transition:transform .3s ease;
}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.08);}
.logo-mark svg{width:24px;height:24px;}
.logo-name{display:flex;flex-direction:column;line-height:1.1;}
.logo-name strong{font-size:19px;font-weight:900;}
.logo-name small{color:var(--muted);font-size:11.5px;margin-top:4px;}
.nav-links{display:flex;align-items:center;gap:28px;margin-inline-start:auto;}
.nav-links a{position:relative;color:var(--muted);font-size:14px;transition:.25s ease;}
.nav-links a::after{
  content:"";position:absolute;right:0;bottom:-8px;
  width:0;height:2px;background:var(--gold);transition:.25s ease;
}
.nav-links a:hover{color:var(--text);}
.nav-links a:hover::after{width:100%;}
.nav-actions{display:flex;align-items:center;gap:10px;}
.phone-btn{
  display:flex;align-items:center;gap:8px;
  padding:10px 15px;
  border:1px solid var(--border);border-radius:10px;
  color:var(--teal-light);
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;transition:.25s ease;
}
.phone-btn:hover{border-color:var(--teal);background:rgba(54,184,167,.06);}
.menu-toggle{
  display:none;width:44px;height:44px;font-size:20px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;
}
.mobile-menu{
  position:fixed;top:78px;right:0;left:0;
  background:rgba(8,13,18,.97);
  border-bottom:1px solid var(--border);
  padding:20px;
  transform:translateY(-130%);opacity:0;pointer-events:none;
  transition:.3s ease;z-index:999;
}
.mobile-menu.open{transform:translateY(0);opacity:1;pointer-events:auto;}
.mobile-menu a{
  display:block;padding:14px;border-bottom:1px solid var(--border);color:var(--muted);
}
.mobile-menu a:last-child{border-bottom:0;}

/* =========================================================
   HERO
========================================================= */
.hero{
  position:relative;
  min-height:calc(100vh - 78px);
  display:flex;align-items:center;
  padding:80px 0 100px;
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:70px 70px;
  mask-image:radial-gradient(ellipse at center, black 0%, transparent 72%);
  pointer-events:none;
  animation:gridMove 20s linear infinite;
}
@keyframes gridMove{
  0%{background-position:0 0;}
  100%{background-position:70px 70px;}
}
.hero-glow{
  position:absolute;width:600px;height:600px;border-radius:50%;
  background:rgba(230,162,60,.09);
  filter:blur(100px);
  left:-250px;top:100px;pointer-events:none;
  animation:glowPulse 6s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{transform:scale(1);opacity:.8;}
  50%{transform:scale(1.15);opacity:1;}
}
.hero-grid{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1fr 1fr;
  align-items:center;gap:70px;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  color:var(--gold-light);
  font-family:'IBM Plex Mono',monospace;font-size:13px;
  padding:7px 12px;
  border:1px solid rgba(230,162,60,.22);
  background:rgba(230,162,60,.05);
  border-radius:100px;
  margin-bottom:22px;
  animation:fadeSlideDown .8s ease-out both;
}
.eyebrow::before{
  content:"";width:7px;height:7px;border-radius:50%;
  background:var(--teal);
  box-shadow:0 0 0 5px rgba(54,184,167,.1);
  animation:dotPulse 2s infinite;
}
@keyframes dotPulse{
  0%,100%{box-shadow:0 0 0 5px rgba(54,184,167,.1);}
  50%{box-shadow:0 0 0 8px rgba(54,184,167,.05);}
}
.hero h1{
  font-size:clamp(42px,5.2vw,72px);
  line-height:1.22;letter-spacing:-1px;
  margin-bottom:24px;
}
.hero h1 .word{
  display:inline-block;
  opacity:0;
  transform:translateY(30px) rotateX(-30deg);
  animation:wordReveal .7s cubic-bezier(.22,1,.36,1) forwards;
}
.hero h1 .word:nth-child(1){animation-delay:.3s;}
.hero h1 .word:nth-child(2){animation-delay:.5s;}
.hero h1 span{color:var(--gold);position:relative;}
.hero h1 span::after{
  content:"";position:absolute;
  bottom:8px;right:0;left:0;
  height:3px;background:var(--gold);
  transform:scaleX(0);transform-origin:right;
  animation:underlineGrow 1s .8s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes underlineGrow{to{transform:scaleX(1);}}
@keyframes wordReveal{
  to{opacity:1;transform:translateY(0) rotateX(0);}
}
@keyframes fadeSlideDown{
  from{opacity:0;transform:translateY(-15px);}
  to{opacity:1;transform:translateY(0);}
}
.hero-description{
  max-width:590px;color:var(--muted);
  font-size:clamp(14.5px, 1vw + 11px, 18px);
  line-height:1.9;margin-bottom:34px;
  animation:fadeSlideUp 1s .7s ease-out both;
}
@keyframes fadeSlideUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
.hero-buttons{
  display:flex;flex-wrap:wrap;gap:13px;margin-bottom:38px;
  animation:fadeSlideUp 1s .9s ease-out both;
}
.btn{
  min-height:50px;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:12px 22px;
  border-radius:10px;border:1px solid transparent;
  font-weight:700;font-size:14px;
  position:relative;overflow:hidden;
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}
.btn::before{
  content:"";position:absolute;
  top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  transition:left .6s ease;
}
.btn:hover::before{left:100%;}
.btn:hover{transform:translateY(-3px);}
.btn-primary{
  color:#171007;
  background:linear-gradient(135deg,var(--gold-light),var(--gold-dark));
  box-shadow:0 15px 40px rgba(230,162,60,.2);
}
.btn-primary:hover{box-shadow:0 18px 45px rgba(230,162,60,.4);}
.btn-outline{
  border-color:var(--border);
  background:rgba(255,255,255,.025);
  color:var(--text);
}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-light);}
.hero-stats{display:flex;flex-wrap:wrap;gap:28px;}
.hero-stat{
  padding-inline-start:15px;
  border-inline-start:2px solid var(--gold);
}
.hero-stat strong{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  color:var(--teal-light);font-size:23px;
}
.hero-stat span{color:var(--muted);font-size:13.5px;}

/* =========================================================
   HERO REDESIGNED
========================================================= */
.hero-redesigned{
  min-height:calc(100vh - 78px);
  padding:70px 0 85px;
  display:flex;align-items:center;overflow:hidden;
}
.hero-center{
  position:relative;z-index:2;
  width:min(980px,100%);
  display:flex;flex-direction:column;
  align-items:center;text-align:center;
}
.hero-center .hero-content{max-width:780px;}
.hero-center .hero-description{max-width:700px;margin-inline:auto;}
.hero-center .hero-buttons{justify-content:center;}
.hero-glow-2{
  width:520px;height:520px;
  left:auto;right:-220px;top:260px;
  background:rgba(54,184,167,.07);
}
.technician-stage{
  position:relative;
  width:min(620px,100%);
  height:390px;margin:12px auto 0;
  display:flex;align-items:center;justify-content:center;
}
.technician-glow{
  position:absolute;width:360px;height:260px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(230,162,60,.25) 0%, rgba(54,184,167,.10) 42%, transparent 72%);
  filter:blur(25px);
  animation:technicianGlow 5s ease-in-out infinite;
}
.technician-ring{
  position:absolute;
  border:1px solid rgba(230,162,60,.18);
  border-radius:50%;pointer-events:none;
}
.technician-ring-1{width:360px;height:360px;animation:ringFloat 7s linear infinite;}
.technician-ring-2{width:300px;height:300px;border-color:rgba(54,184,167,.16);animation:ringFloat 10s linear infinite reverse;}
.technician-photo-wrap{
  position:relative;z-index:3;
  width:285px;height:350px;
  overflow:hidden;
  border-radius:145px 145px 35px 35px;
  border:1px solid rgba(230,162,60,.45);
  background:#0b1118;
  box-shadow:0 35px 80px rgba(0,0,0,.55), 0 0 0 9px rgba(230,162,60,.035), 0 0 55px rgba(230,162,60,.12);
  animation:technicianFloat 5s ease-in-out infinite;
}
.technician-photo{
  width:100%;height:100%;
  object-fit:cover;object-position:center;
  filter:saturate(.92) contrast(1.04);
}
.technician-photo-wrap::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(8,13,18,.02) 35%, rgba(8,13,18,.35) 100%);
  pointer-events:none;
}
.tech-badge{
  position:absolute;z-index:5;
  display:flex;align-items:center;gap:10px;
  min-width:190px;padding:12px 14px;text-align:right;
  background:rgba(10,16,22,.88);
  border:1px solid var(--border);border-radius:14px;
  backdrop-filter:blur(12px);
  box-shadow:0 18px 45px rgba(0,0,0,.35);
}
.tech-badge-top{right:25px;top:35px;animation:badgeFloat 4.5s ease-in-out infinite;}
.tech-badge-bottom{left:20px;bottom:28px;animation:badgeFloat 5.2s ease-in-out infinite reverse;}
.tech-badge-icon{
  width:38px;height:38px;display:grid;place-items:center;flex-shrink:0;
  border-radius:10px;
  background:rgba(230,162,60,.08);
  border:1px solid rgba(230,162,60,.18);
  font-size:18px;
}
.tech-badge strong,.tech-badge small{display:block;}
.tech-badge strong{color:var(--text);font-size:13px;}
.tech-badge small{color:var(--muted);font-size:10.5px;margin-top:2px;}
.hero-stats-center{justify-content:center;margin-top:20px;}
.hero-stats-center .hero-stat{text-align:right;}
@keyframes technicianFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-9px);}
}
@keyframes technicianGlow{
  0%,100%{transform:scale(.96);opacity:.75;}
  50%{transform:scale(1.06);opacity:1;}
}
@keyframes ringFloat{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
@keyframes badgeFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-7px);}
}

/* =========================================================
   TRUST BAR
========================================================= */
.trust{
  border-block:1px solid var(--border);
  background:rgba(255,255,255,.018);
}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);}
.trust-item{
  display:flex;align-items:center;gap:13px;
  padding:22px;border-inline-start:1px solid var(--border);
  transition:background .3s ease, transform .3s ease;
}
.trust-item:hover{background:rgba(230,162,60,.04);transform:translateY(-3px);}
.trust-item:first-child{border-inline-start:0;}
.trust-icon{color:var(--gold);font-size:26px;line-height:1;flex-shrink:0;transition:transform .3s ease;}
.trust-item:hover .trust-icon{transform:scale(1.2) rotate(-8deg);}
.trust-item strong{display:block;font-size:15.5px;}
.trust-item span{color:var(--muted);font-size:13px;}

/* =========================================================
   SECTION HEAD
========================================================= */
.section-head{max-width:720px;margin-bottom:55px;}
.section-label{
  display:inline-flex;align-items:center;gap:9px;
  color:var(--gold-light);
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  margin-bottom:13px;
}
.section-label::before{
  content:"";width:6px;height:6px;background:var(--gold);
  transform:rotate(45deg);
  animation:rotateSquare 3s linear infinite;
}
@keyframes rotateSquare{to{transform:rotate(405deg);}}
.section-head h2{
  font-size:clamp(34px,4vw,52px);
  line-height:1.3;margin-bottom:13px;
}
.section-head p{color:var(--muted);font-size:clamp(13.5px, .6vw + 12px, 16px);}

/* =========================================================
   SERVICES
========================================================= */
.services{background:linear-gradient(180deg,transparent,rgba(255,255,255,.015));}
.services-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;}
.service-card{
  position:relative;
  padding:30px 25px;
  background:linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
  border:1px solid var(--border);border-radius:15px;
  overflow:hidden;
  transition:transform .4s cubic-bezier(.22,1,.36,1), border-color .3s ease, box-shadow .3s ease;
}
.service-card::before{
  content:"";position:absolute;
  width:120px;height:120px;
  top:-70px;left:-60px;
  background:rgba(230,162,60,.08);
  filter:blur(35px);
  transition:transform .5s ease;
}
.service-card:hover::before{transform:translate(30px,30px) scale(1.4);}
.service-card:hover{
  transform:translateY(-7px);
  border-color:var(--border-gold);
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.service-number{
  position:absolute;top:20px;left:20px;
  color:rgba(230,162,60,.35);
  font-family:'IBM Plex Mono',monospace;font-size:12px;
}
.service-icon-big{
  font-size:44px;margin-bottom:18px;
  display:block;
  transition:transform .4s cubic-bezier(.22,1,.36,1);
}
.service-card:hover .service-icon-big{
  transform:translateY(-5px) scale(1.15) rotate(-5deg);
}
.service-card h3{font-size:18px;margin-bottom:8px;}
.service-card p{color:var(--muted);font-size:14.5px;line-height:1.9;}
.service-meta{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:18px;padding-top:14px;
  border-top:1px dashed var(--border);
  color:var(--muted);font-size:12.5px;
}
.service-meta strong{color:var(--teal-light);font-family:'IBM Plex Mono',monospace;}

/* =========================================================
   PROCESS
========================================================= */
.process-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  border:1px solid var(--border);border-radius:15px;overflow:hidden;
}
.process-card{
  padding:34px 26px;
  background:rgba(255,255,255,.015);
  border-inline-start:1px solid var(--border);
  position:relative;overflow:hidden;
  transition:background .3s ease;
}
.process-card:hover{background:rgba(230,162,60,.04);}
.process-card:first-child{border-inline-start:0;}
.process-number{
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;font-size:28px;
  margin-bottom:18px;
  transition:transform .3s ease;
  display:inline-block;
}
.process-card:hover .process-number{transform:scale(1.2) translateX(-5px);}
.process-card h3{font-size:17px;margin-bottom:8px;}
.process-card p{color:var(--muted);font-size:14.5px;}

/* =========================================================
   PRICING
========================================================= */
.pricing{
  background:radial-gradient(ellipse at center top, rgba(230,162,60,.08), transparent 50%);
}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.price-card{
  position:relative;
  padding:36px 30px;
  background:var(--surface);
  border:1px solid var(--border);border-radius:16px;
  display:flex;flex-direction:column;
  transition:transform .4s cubic-bezier(.22,1,.36,1), box-shadow .3s ease, border-color .3s ease;
}
.price-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);}
.price-card.featured{
  border-color:var(--gold);
  background:linear-gradient(180deg, rgba(230,162,60,.08), transparent 45%), var(--surface);
  animation:featuredPulse 3s ease-in-out infinite;
}
@keyframes featuredPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(230,162,60,.15);}
  50%{box-shadow:0 0 0 12px rgba(230,162,60,0);}
}
.popular{
  position:absolute;top:0;left:0;
  padding:7px 14px;
  color:#171007;
  background:linear-gradient(135deg,var(--gold-light),var(--gold-dark));
  border-radius:16px 0 10px 0;
  font-size:12.5px;font-weight:800;
}
.price-tag{color:var(--muted);font-size:13.5px;margin-bottom:6px;}
.price-card h3{font-size:21px;margin-bottom:16px;}
.price{
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(26px, 2vw + 16px, 34px);
  color:var(--text);
}
.price small{font-family:'Noto Kufi Arabic',sans-serif;color:var(--muted);font-size:13.5px;}
.price-list{list-style:none;margin:25px 0 30px;flex:1;}
.price-list li{
  position:relative;
  padding:9px 20px 9px 0;
  border-top:1px solid var(--border);
  color:var(--muted);font-size:14.5px;
}
.price-list li::before{
  content:"✓";position:absolute;right:0;
  color:var(--teal-light);font-weight:bold;
}

/* =========================================================
   PROGRAMMING
========================================================= */
.programming-section{
  background:linear-gradient(180deg,rgba(255,255,255,.015),transparent);
  border-block:1px solid var(--border);
}
.programming-head{max-width:760px;margin:0 auto 34px;text-align:center;}
.programming-head h2{margin:8px 0 12px;font-size:clamp(24px,3vw,34px);}
.programming-head p{color:var(--muted);font-size:13.5px;line-height:1.9;margin:0;}
.programming-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;
  max-width:980px;margin:auto;
}
.programming-card{
  padding:24px 22px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);border-radius:18px;
  transition:transform .3s ease, border-color .3s ease, background .3s ease;
}
.programming-card:hover{
  transform:translateY(-4px);
  border-color:var(--border-gold);
  background:rgba(255,255,255,.04);
}
.programming-icon{
  width:46px;height:46px;
  display:grid;place-items:center;
  margin-bottom:16px;border-radius:13px;
  color:var(--gold-light);
  background:rgba(230,162,60,.08);
  border:1px solid rgba(230,162,60,.18);
  font-family:'IBM Plex Mono',monospace;
  font-size:18px;
  transition:transform .4s cubic-bezier(.22,1,.36,1);
}
.programming-card:hover .programming-icon{transform:rotate(-10deg) scale(1.1);}
.programming-card h3{font-size:16px;margin-bottom:8px;}
.programming-card p{color:var(--muted);font-size:12.5px;line-height:1.85;margin:0;}
.programming-tag{display:block;margin-top:13px;color:var(--teal-light);font-size:10px;opacity:.9;}
.programming-cta{
  max-width:980px;margin:22px auto 0;
  padding:18px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  border:1px solid var(--border);border-radius:18px;
  background:rgba(255,255,255,.02);
}
.programming-cta strong{display:block;font-size:14px;margin-bottom:4px;}
.programming-cta span{display:block;color:var(--muted);font-size:11.5px;}

/* =========================================================
   SHOP / TEASER
========================================================= */
.shop-section{
  position:relative;overflow:hidden;
  border-block:1px solid var(--border);
  background:radial-gradient(ellipse at center top, rgba(230,162,60,.07), transparent 55%);
}
.shop-section::before{
  content:"";position:absolute;
  width:520px;height:520px;border-radius:50%;
  top:-260px;right:-180px;
  background:radial-gradient(circle, rgba(212,175,55,.13), transparent 68%);
  pointer-events:none;
  animation:shopGlow 8s ease-in-out infinite;
}
@keyframes shopGlow{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(-30px,30px) scale(1.1);}
}
.shop-intro{max-width:820px;margin-inline:auto;text-align:center;}
.shop-intro strong{color:var(--gold);}
.teaser-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;margin-top:34px;
}
.teaser-card{
  position:relative;overflow:hidden;
  border:1px solid var(--border);border-radius:24px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  box-shadow:0 18px 45px rgba(0,0,0,.18);
  transition:transform .4s cubic-bezier(.22,1,.36,1), box-shadow .3s ease, border-color .3s ease;
}
.teaser-card:hover{
  transform:translateY(-7px);
  box-shadow:0 25px 55px rgba(0,0,0,.28);
  border-color:rgba(212,175,55,.42);
}
.teaser-image{
  position:relative;height:220px;overflow:hidden;background:#111;
}
.teaser-image::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.58), transparent 55%);
}
.teaser-image img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .55s ease;
}
.teaser-card:hover .teaser-image img{transform:scale(1.08);}
.teaser-badge
