<style>
/* =========================================================
   LUXURY GAMING DEVICES
   ========================================================= */

.real-gaming-devices {
  position: relative;
  width: 100%;
  min-height: 520px;
  display: flex;
  align-items: center;
  justify-content: center;
  isolation: isolate;
}

.real-device-glow {
  position: absolute;
  width: 420px;
  height: 260px;
  border-radius: 50%;
  background:
    radial-gradient(
      ellipse,
      rgba(0, 229, 255, .22) 0%,
      rgba(120, 60, 255, .12) 40%,
      transparent 72%
    );
  filter: blur(28px);
  animation: luxuryGlow 4s ease-in-out infinite;
  z-index: -1;
}

.real-laptop-img {
  position: absolute;
  width: min(560px, 68%);
  max-width: 560px;
  left: 2%;
  top: 42px;
  z-index: 3;
  object-fit: contain;
  filter:
    drop-shadow(0 25px 30px rgba(0,0,0,.48))
    drop-shadow(0 0 18px rgba(0,180,255,.12));
  animation: realLaptopFloat 4.5s ease-in-out infinite;
  transition: transform .5s ease, filter .5s ease;
}

.real-pc-img {
  position: absolute;
  width: min(390px, 48%);
  max-width: 390px;
  right: 1%;
  bottom: 25px;
  z-index: 2;
  object-fit: contain;
  filter:
    drop-shadow(0 28px 32px rgba(0,0,0,.55))
    drop-shadow(0 0 20px rgba(160,70,255,.18));
  animation: realPcFloat 5s ease-in-out infinite;
  transition: transform .5s ease, filter .5s ease;
}

.real-laptop-img:hover {
  transform: scale(1.04) rotate(-1deg);
  filter:
    drop-shadow(0 30px 35px rgba(0,0,0,.55))
    drop-shadow(0 0 30px rgba(0,210,255,.25));
}

.real-pc-img:hover {
  transform: scale(1.04) translateY(-5px);
  filter:
    drop-shadow(0 30px 35px rgba(0,0,0,.6))
    drop-shadow(0 0 30px rgba(160,80,255,.28));
}

.real-device-label {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  padding: 9px 18px;
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 999px;
  background: rgba(8,12,20,.65);
  backdrop-filter: blur(14px);
  color: rgba(255,255,255,.72);
  font-size: 11px;
  letter-spacing: .5px;
  white-space: nowrap;
  box-shadow:
    0 10px 30px rgba(0,0,0,.25),
    inset 0 0 20px rgba(255,255,255,.025);
}

@keyframes realLaptopFloat {
  0%,100% {
    transform: translateY(0) rotate(0deg);
  }

  50% {
    transform: translateY(-16px) rotate(-.6deg);
  }
}

@keyframes realPcFloat {
  0%,100% {
    transform: translateY(0) rotate(0deg);
  }

  50% {
    transform: translateY(13px) rotate(.5deg);
  }
}

@keyframes luxuryGlow {
  0%,100% {
    opacity: .55;
    transform: scale(.95);
  }

  50% {
    opacity: 1;
    transform: scale(1.08);
  }
}

/* الرابط الجغرافي */
.location-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: fit-content;
  margin: 18px auto 0;
  padding: 12px 20px;
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 14px;
  color: inherit;
  text-decoration: none;
  background: rgba(255,255,255,.035);
  transition: .3s ease;
}

.location-link:hover {
  transform: translateY(-3px);
  background: rgba(255,255,255,.07);
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}

/* قائمة المناطق */
.location-select {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.10);
  background: rgba(255,255,255,.045);
  color: inherit;
  outline: none;
  font: inherit;
  cursor: pointer;
}

.location-select:focus {
  border-color: rgba(0,200,255,.45);
  box-shadow: 0 0 0 3px rgba(0,200,255,.08);
}

.location-select option,
.location-select optgroup {
  background: #10151d;
  color: #fff;
}

/* الموبايل */
@media (max-width: 900px) {

  .real-gaming-devices {
    min-height: 440px;
  }

  .real-laptop-img {
    width: 62%;
    left: 3%;
    top: 35px;
  }

  .real-pc-img {
    width: 43%;
    right: 3%;
    bottom: 45px;
  }
}

@media (max-width: 620px) {

  .real-gaming-devices {
    min-height: 380px;
  }

  .real-laptop-img {
    width: 67%;
    left: -2%;
    top: 30px;
  }

  .real-pc-img {
    width: 46%;
    right: 0;
    bottom: 48px;
  }

  .real-device-label {
    font-size: 9px;
    padding: 7px 12px;
  }
}
</style>
